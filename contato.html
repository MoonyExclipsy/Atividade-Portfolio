  <link rel="stylesheet" href="css/style.css">

<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">TechNova</a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="sobre.html">Sobre Nós</a></li>

          <li><a href="contato.html" class="active">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Entre em Contato</h1>
      <p>Envie uma mensagem para a nossa equipe e receba um orçamento personalizado.</p>
    </section>

    <section class="card" style="max-width: 600px; margin: 0 auto;">
      <form action="#" method="post">
        <div class="form-group">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" required placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label for="email">E-mail Corporativo:</label>
          <input type="email" id="email" name="email" required placeholder="seuemail@empresa.com">
        </div>
        <div class="form-group">
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Como podemos ajudar sua empresa?"></textarea>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Enviar Mensagem</button>
      </form>
    </section>
  </main>

  </footer>
